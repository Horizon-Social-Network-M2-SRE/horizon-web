name: web-ci

# Shared checks from horizon-infrastructure (S1-02): lint, test, build, gitleaks, then the image
# built, scanned with Trivy and pushed to GHCR (sha-<commit> and main) on main.
# Check names: ci / lint, ci / test, ci / build, ci / secrets, ci / image.
# The API client types are checked by api-client.yml; the image runtime by docker.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: Horizon-Social-Network-M2-SRE/horizon-infrastructure/.github/workflows/node-ci.yml@main
    permissions:
      contents: read
      packages: write
